# ─── Banco PostgreSQL (Render) ───────────────────────────────────────────────
# As variáveis vêm das envs configuradas no painel do Render:
#   SPRING_DATASOURCE_URL      = jdbc:postgresql://HOST:PORT/DB
#   SPRING_DATASOURCE_USERNAME = usuario do Postgres
#   SPRING_DATASOURCE_PASSWORD = senha do Postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
# update = cria/atualiza tabelas automaticamente a partir das @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true

# Não rodar schema-postgres.sql automaticamente — o Hibernate já cuida do schema
spring.sql.init.mode=never

# H2 console desligado em prod
spring.h2.console.enabled=false